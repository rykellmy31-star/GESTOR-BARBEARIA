name: TIGU - aplicar correcao validada de dependencias uma unica vez

# Restrito a branch temporaria e ao commit de gatilho exato.
# Nao acessa Cloudflare, D1, R2 ou segredos de producao.
on:
  push:
    branches:
      - feature/tigu-mensalidade-manual-preintegracao-20261028

permissions:
  contents: write

jobs:
  atualizar-lockfile:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'TIGU_APPLY_SECURITY_UPGRADE_ONCE' && github.ref == 'refs/heads/feature/tigu-mensalidade-manual-preintegracao-20261028' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Preparar dependencias originais
        run: npm ci --no-audit --prefer-offline
      - name: Gerar package-lock corrigido e reproduzivel
        run: npm install --save-exact --ignore-scripts --no-audit zod@4.6.7 wrangler@4.155.0 @cloudflare/vitest-plugin@1.4.10 @cloudflare/workers-types@5.20261029.1
      - name: Impedir commit com vulnerabilidades conhecidas
        run: npm audit --audit-level=moderate
      - name: Impedir commit se tipos, compilacao ou testes falharem
        run: npm run check:types && npm run build && npm test
      - name: Commitar APENAS manifesto e lockfile na branch de desenvolvimento
        run: |
          git config user.name "TIGU CI"
          git config user.email "tigu-ci@users.noreply.github.com"
          git add -- package.json package-lock.json
          git diff --cached --quiet && { echo "Nenhuma dependencia a atualizar"; exit 0; }
          git commit -m "TIGU: atualizar Zod e Cloudflare com auditoria e testes aprovados"
          git push origin HEAD:refs/heads/feature/tigu-mensalidade-manual-preintegracao-20261028
