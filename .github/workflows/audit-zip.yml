name: Validar Tigu a partir do ZIP

on:
  push:
    branches:
      - audit/tigu-primeira-validacao
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-zip:
    name: Tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Conferir conteúdo do ZIP
        run: |
          test -f tigu.zip
          unzip -tq tigu.zip
          unzip -Z -1 tigu.zip | grep -q '^tigu/package.json$'
          unzip -q tigu.zip -d project
          test -f project/tigu/package-lock.json

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: project/tigu/package-lock.json

      - name: Instalar dependências
        working-directory: project/tigu
        run: npm ci

      - name: Validar TypeScript
        working-directory: project/tigu
        run: npm run check:types

      - name: Rodar testes
        working-directory: project/tigu
        run: npm test

      - name: Verificar build
        working-directory: project/tigu
        run: npm run build
