name: TIGU - diagnostico seguro da producao Pix
on:
  push:
    branches: [audit/tigu-primeira-validacao]
permissions:
  contents: read
jobs:
  ler-somente-status:
    if: ${{ github.event.head_commit.message == 'TIGU_PRODUCTION_SECRET_AND_SCHEMA_READONLY_ONCE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir presença de credenciais necessárias sem abrir os valores
        env:
          MP_MARKETPLACE_CLIENT_ID: ${{ secrets.MP_MARKETPLACE_CLIENT_ID }}
          MP_MARKETPLACE_CLIENT_SECRET: ${{ secrets.MP_MARKETPLACE_CLIENT_SECRET }}
          MP_MARKETPLACE_WEBHOOK_SECRET: ${{ secrets.MP_MARKETPLACE_WEBHOOK_SECRET }}
          MP_MARKETPLACE_REDIRECT_URI: ${{ secrets.MP_MARKETPLACE_REDIRECT_URI }}
          MSG_ENC_KEY: ${{ secrets.MSG_ENC_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
        run: |
          node --input-type=module -e '
            const required=["MP_MARKETPLACE_CLIENT_ID","MP_MARKETPLACE_CLIENT_SECRET",
              "MP_MARKETPLACE_WEBHOOK_SECRET","MP_MARKETPLACE_REDIRECT_URI",
              "MSG_ENC_KEY","SESSION_SECRET","PUBLIC_URL"];
            const present=required.filter(k=>Boolean(process.env[k]));
            const missing=required.filter(k=>!process.env[k]);
            console.log("TIGU_PRODUCTION_SECRETS_PRESENCE:",
              JSON.stringify({present_count:present.length,missing}));
            console.log("Nao ler, comparar ou imprimir valores de segredos.");
          '
      - name: Verificar somente esquema do banco D1 existente
        env:
          CLOUDFLARE_PRODUCTION_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          TIGU_PRODUCTION_DB_READONLY_APPROVED: 'YES'
        run: node scripts/production-d1-schema-readonly.mjs
