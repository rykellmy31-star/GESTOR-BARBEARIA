name: TIGU - verificar token Cloudflare producao
on:
  push:
    branches: [audit/tigu-primeira-validacao]
permissions:
  contents: read
jobs:
  checar-acesso-producao:
    if: ${{ github.event.head_commit.message == 'TIGU_VERIFY_PRODUCTION_TOKEN_ONCE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Provar testes somente-leitura
        run: node --test scripts/production-payment-readiness-readonly.node.test.mjs
      - name: Verificar token com GET sem imprimir credencial
        env:
          CLOUDFLARE_PRODUCTION_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_PRODUCTION_TOKEN" ]; then
            echo "::error::CLOUDFLARE_PRODUCTION_TOKEN nao encontrado como segredo do repositorio."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID ausente."
            exit 1
          fi
          node scripts/production-token-readonly-ci.mjs
