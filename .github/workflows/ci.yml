name: Tigu - verificacao de codigo

on:
  push:
    branches:
      - audit/tigu-primeira-validacao
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Auditar dependencias de producao
        run: npm audit --omit=dev --audit-level=high
      - name: Validar sintaxe dos scripts de homologacao
        run: |
          node --check scripts/staging.mjs
          node --check scripts/staging-config.mjs
          node --check scripts/staging-config.test.mjs
          node --check scripts/staging-smoke.mjs
          node --test scripts/staging-config.test.mjs
          node --check scripts/create-super.mjs
          node -e "const fs=require('node:fs');const j=JSON.parse(fs.readFileSync('wrangler.staging.template.jsonc','utf8'));if(j.name!=='tigu-staging'||j.vars.TIGU_STAGING!=='1'||j.vars.APP_ENV!=='production'||j.triggers.crons.length!==0)process.exit(1)"
          node scripts/staging.mjs prepare --database-id 00000000-0000-4000-8000-000000000001
          node scripts/staging.mjs validate
          rm wrangler.staging.jsonc
      - name: Verificar tipos
        run: npm run check:types
      - name: Gerar dist antes dos testes Workers
        run: npm run build
      - name: Conferir atribuição de autoria no frontend compilado
        run: |
          grep -R -q 'Sistema desenvolvido por' dist/assets
          grep -R -q 'Carlos Rykellmy Santos Correia' dist/assets
          grep -R -q 'Filtrar agendamentos por barbeiro' dist/assets
          grep -R -q 'Profissional:' dist/assets
          grep -R -q 'Prévia sem API conectada' dist/assets
          grep -R -q 'Planos e valores da página de vendas' dist/assets
          grep -R -q 'Solicitar atendimento comercial' dist/assets
          grep -R -q 'Enviar solicitação de atendimento' dist/assets
          grep -R -q 'Interessados nos planos' dist/assets
      - name: Rodar testes
        run: npm test
