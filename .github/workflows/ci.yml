name: Tigu - verificacao de codigo

# Validacao gratuita somente em desenvolvimento, PRs para main e disparo manual.
# Nao executa deploy, migrations remotas ou tokens de provedores.
on:
  push:
    branches:
      - audit/tigu-primeira-validacao
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tigu-validation-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Validar auditoria, homologacao, tipos, build e testes
        run: npm run validate
      - name: Homologar fluxos HTTP completos com Worker, D1 e R2 locais
        run: node scripts/local-e2e.mjs
      - name: Testar jornada real no navegador Chromium local
        run: node scripts/browser-smoke.mjs
      # Executa somente depois da suite local, em push da branch autorizada,
      # usando a URL homologada do Worker (ou Variable explicitamente definida).
      # Script faz apenas GET, recusa dominios fora de tigu-staging.*.workers.dev.
      - name: Conferir homologacao Cloudflare online (se configurada)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/audit/tigu-primeira-validacao' }}
        env:
          STAGING_URL: ${{ vars.TIGU_STAGING_URL || 'https://tigu-staging.netssh3-0.workers.dev' }}
        run: node scripts/staging-smoke.mjs
      # Apenas leitura de metadados, depois dos testes locais e somente na
      # branch de auditoria; o token fica em Repository secrets do TIGU.
      # A etapa roda mesmo com credenciais ausentes para indicar precisamente o
      # erro; o script encerra antes da rede se token/Account ID estiver faltando.
      - name: Diagnosticar acesso Cloudflare por token (se configurado)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/audit/tigu-primeira-validacao' }}
        env:
          CLOUDFLARE_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_AUDIT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cloudflare-audit.mjs

      # Um unico commit com mensagem exata libera SOMENTE criação D1/R2
      # em homologação. Não roda em PR, no disparo manual ou em commits
      # seguintes. O script usa allowlist de endpoints e nomes literais.
      - name: Provisionar D1 e R2 isolados do TIGU (commit unico)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/audit/tigu-primeira-validacao' && github.event.head_commit.message == 'TIGU_PROVISION_STAGING_ONCE' }}
        env:
          CLOUDFLARE_STAGING_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          TIGU_STAGING_CREATE_APPROVED: YES
        run: node scripts/staging-provision.mjs create

      # Gatilho separado, unico e explicito: publica apenas tigu-staging,
      # aplica migrations so em tigu-staging-db e usa tigu-staging-media.
      # Exige os testes anteriores aprovados e nunca roda em PR ou em main.
      - name: Publicar Worker TIGU staging isolado (commit unico)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/audit/tigu-primeira-validacao' && github.event.head_commit.message == 'TIGU_DEPLOY_STAGING_ONCE' }}
        env:
          CLOUDFLARE_STAGING_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          TIGU_STAGING_DEPLOY_APPROVED: YES
        run: node scripts/staging-deploy-ci.mjs
