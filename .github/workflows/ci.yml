name: Tigu - verificacao de codigo

# Validacao gratuita somente em desenvolvimento, PRs para main e disparo manual.
# Nao executa deploy, migrations remotas ou tokens de provedores.
on:
  push:
    branches:
      - audit/tigu-primeira-validacao
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tigu-validation-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Validar auditoria, homologacao, tipos, build e testes
        run: npm run validate
