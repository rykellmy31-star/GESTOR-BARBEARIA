name: Tigu - verificacao de codigo

on:
  push:
    branches:
      - audit/tigu-primeira-validacao
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar tipos
        run: npm run check:types
      - name: Gerar dist antes dos testes Workers
        run: npm run build
      - name: Rodar testes
        run: npm test
