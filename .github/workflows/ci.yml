name: Tigu - verificacao de codigo

# Validacao gratuita somente em desenvolvimento, PRs para main e disparo manual.
# Nao executa deploy, migrations remotas ou tokens de provedores.
on:
  push:
    branches:
      - audit/tigu-primeira-validacao
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tigu-validation-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Validar auditoria, homologacao, tipos, build e testes
        run: npm run validate
      - name: Homologar fluxos HTTP completos com Worker, D1 e R2 locais
        run: node scripts/local-e2e.mjs
      - name: Testar jornada real no navegador Chromium local
        run: node scripts/browser-smoke.mjs
      # Executa somente depois da suite local, em push da branch autorizada,
      # quando o operador definir uma URL do Worker de testes nas Variables.
      # Script faz apenas GET, recusa dominios fora de tigu-staging.*.workers.dev.
      - name: Conferir homologacao Cloudflare online (se configurada)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/audit/tigu-primeira-validacao' && vars.TIGU_STAGING_URL != '' }}
        env:
          STAGING_URL: ${{ vars.TIGU_STAGING_URL }}
        run: node scripts/staging-smoke.mjs
