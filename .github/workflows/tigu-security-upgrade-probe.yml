name: TIGU - prova isolada de atualizacao de seguranca

# Apenas testa upgrades em runner efemero. Nao grava lockfile, publica ou usa segredos.
on:
  pull_request:
    branches:
      - audit/tigu-primeira-validacao
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simular-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar ambiente original
        run: npm ci --no-audit --prefer-offline
      - name: Simular atualizacao de dependencias vulneraveis sem commitar
        run: npm install --save-exact --ignore-scripts --no-audit zod@4.6.7 wrangler@4.155.0 @cloudflare/vitest-plugin@1.4.10
      - name: Verificar vulnerabilidades apos atualizacao simulada
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=moderate
      - name: Validar tipos e build com Zod 4 e Cloudflare atualizada
        id: compile
        continue-on-error: true
        run: npm run check:types && npm run build
      - name: Executar testes automatizados no ambiente temporario
        id: tests
        continue-on-error: true
        run: npm test
      - name: Empacotar lockfile simulado para revisao
        uses: actions/upload-artifact@v4
        with:
          name: tigu-security-probe-lockfile
          path: |
            package.json
            package-lock.json
          retention-days: 3
      - name: Exibir diagnostico final e nao fingir aprovacao
        env:
          AUDIT: ${{ steps.audit.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          echo "Auditoria: $AUDIT | Tipos/build: $COMPILE | Testes: $TESTS"
          if [ "$AUDIT" != "success" ] || [ "$COMPILE" != "success" ] || [ "$TESTS" != "success" ]; then
            echo "Atualizacao ainda nao aprovada: revisar incompatibilidades."
            exit 1
          fi
